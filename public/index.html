<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      type="image/x-icon"
      sizes="16x16 32x32 48x48"
      href="%PUBLIC_URL%/favicon.ico?v=20261029"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon-32x32.png?v=20261029"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/favicon-16x16.png?v=20261029"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111214" />
    <script>
      (function () {
        try {
          var saved = JSON.parse(
            localStorage.getItem("eh-appearance-v1") || "{}",
          );
          var preference =
            ["light", "dark", "system"].indexOf(saved.theme) >= 0
              ? saved.theme
              : "dark";
          var mode =
            preference === "system"
              ? window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : preference;
          var text =
            ["standard", "large", "xlarge"].indexOf(saved.textSize) >= 0
              ? saved.textSize
              : "standard";
          var root = document.documentElement;
          root.setAttribute("data-theme", mode);
          root.setAttribute("data-text-size", text);
          root.setAttribute(
            "data-density",
            saved.density === "compact" ? "compact" : "comfortable",
          );
          root.style.fontSize =
            { standard: 16, large: 18, xlarge: 20 }[text] + "px";
          document.querySelector('meta[name="theme-color"]').content =
            mode === "light" ? "#f5f5f7" : "#111214";
        } catch (error) {}
      })();
    </script>
    <meta name="author" content="Vijay Anand" />
    <link rel="author" href="https://github.com/vijayanand1505" />
    <meta
      name="description"
      content="Browse movies and TV series, save titles to your watchlist, and choose a movie with friends on Entertainment Hub."
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/apple-touch-icon.png?v=20261029"
    />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json?v=20261029" />
    <title>Entertainment Hub — Vijay Anand</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
